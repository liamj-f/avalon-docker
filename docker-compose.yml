services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-avalon}
    volumes:
      - avalon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avalon} -d ${POSTGRES_DB:-avalon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Pre-built by .github/workflows/docker-publish.yml on every push to
    # main. Multi-arch (amd64 + arm64), so this resolves correctly on any
    # host. Pin IMAGE_TAG (e.g. to a short commit SHA or a v*.*.* release)
    # instead of always floating on :latest if you want reproducible
    # deploys. To build from source instead, replace `image:` with
    # `build: ./backend`.
    image: ghcr.io/liamj-f/avalon-docker/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-avalon}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-avalon}
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/liamj-f/avalon-docker/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  avalon-pgdata:
