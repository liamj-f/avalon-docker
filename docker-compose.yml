services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-avalon}
    volumes:
      - avalon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avalon} -d ${POSTGRES_DB:-avalon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Pre-built by .github/workflows/docker-publish.yml on every push to
    # main. Multi-arch (amd64 + arm64), so this resolves correctly on any
    # host. Pin IMAGE_TAG (e.g. to a short commit SHA or a v*.*.* release)
    # instead of always floating on :latest if you want reproducible
    # deploys. To build from source instead, replace `image:` with
    # `build: ./backend`.
    image: ghcr.io/liamj-f/avalon-docker/backend:${IMAGE_TAG:-latest}
    # A fixed, friendly name for `docker ps`/`docker logs`/other tooling.
    # Doesn't change how other containers reach this one -- Compose keeps
    # aliasing it as `backend` on the `default` network regardless (that's
    # what DATABASE_URL below and BACKEND_HOST on frontend rely on) -- but
    # it does mean you can't run two copies of this stack on one Docker
    # host without renaming one of them; fine for a single self-hosted
    # instance.
    container_name: avalon-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      # Handed down as discrete vars rather than a pre-assembled DATABASE_URL
      # -- see backend/src/db.py:database_url() -- so a POSTGRES_PASSWORD
      # containing a URL-special character (e.g. '@') can't silently corrupt
      # the DSN via plain ${VAR} interpolation.
      POSTGRES_USER: ${POSTGRES_USER:-avalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-avalon}
      DB_HOST: db
      DB_PORT: 5432
      CORS_ORIGIN: "*"
    healthcheck:
      # No curl/wget in python:3.12-slim -- urllib is stdlib, so this needs
      # nothing extra installed in the image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/liamj-f/avalon-docker/frontend:${IMAGE_TAG:-latest}
    container_name: avalon-ui
    restart: unless-stopped
    environment:
      # See frontend/nginx.conf.template -- must match wherever the backend
      # actually is. avalon-backend resolves here via container_name above
      # (Docker's embedded DNS resolves by container name automatically,
      # network-wide, independent of Compose's own `backend` service-name
      # alias, which also still works).
      BACKEND_HOST: avalon-backend
      BACKEND_PORT: 4000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      # nginx:1.27-alpine has no curl, but alpine's busybox wget is built in.
      # /healthz (not /) so this never shows up in nginx's access log
      # alongside real page loads -- see nginx.conf.template.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  avalon-pgdata:
