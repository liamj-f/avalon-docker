<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avalon &middot; The Resistance</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9876;&#65039;</text></svg>" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Single unconditional tag rather than a prefers-color-scheme-gated
         pair -- ThemeToggle.jsx sets its content directly on toggle, which
         a media-query-gated tag can't respond to (it only ever reflects
         the OS, never an explicit in-app override). Starts dark to match
         :root's own unconditional default; ThemeToggle corrects it on
         mount if the effective theme is actually light. -->
    <meta name="theme-color" content="#0f1420" />
    <meta name="color-scheme" content="dark light" />
    <!-- Blocking and inline deliberately: applies a stored explicit theme
         choice before styles.css is even parsed, so a returning visitor
         who picked light on a dark-preferring OS (or vice versa) never
         sees a flash of the wrong theme while React mounts. ThemeToggle.jsx
         takes over from here for actual toggle clicks. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('avalon.theme');
          if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* localStorage unavailable (private mode, etc) -- just follow the OS */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
