# Use this instead of docker-compose.yml when Postgres is already running
# somewhere else (a managed instance, a shared box, another compose stack)
# and you don't want this app to also spin up its own local `db` container.
#
#   docker compose -f docker-compose.external-db.yml up --build
#
# Prerequisites, on the existing Postgres instance:
#   - The database named by POSTGRES_DB already exists (the app only ever
#     runs its own migrations *inside* that database -- it never creates
#     the database itself).
#   - The role named by POSTGRES_USER already exists, can log in with
#     POSTGRES_PASSWORD, and owns (or has CREATE on) that database, since
#     the backend applies backend/migrations/*.sql on every boot (idempotent
#     -- tracked in a schema_migrations table -- so this is safe to leave on
#     every restart).
#
# Set DB_HOST/DB_PORT/POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD via a
# .env file (see .env.external-db.example) or your shell/orchestrator's own
# env-var mechanism. This file intentionally has no `db:` service and no
# volume for one, since Postgres' data directory isn't this stack's to own
# in this mode.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      # Handed down as discrete vars rather than a pre-assembled DATABASE_URL
      # -- see backend/src/db.py:database_url() -- so a POSTGRES_PASSWORD
      # containing a URL-special character (e.g. '@') can't silently corrupt
      # the DSN via plain ${VAR} interpolation.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      DB_HOST: ${DB_HOST:?set DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      CORS_ORIGIN: "*"
      # The backend itself already retries the initial connection with
      # backoff (see backend/src/db.py:wait_for_db), so no depends_on dance
      # is needed here the way the bundled `db` service has one -- there's
      # no local container whose startup we could order against anyway. The
      # healthcheck below is still useful on its own, though: it's what lets
      # frontend's depends_on wait for the backend to actually be serving.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      # /healthz (not /) so this never shows up in nginx's access log
      # alongside real page loads -- see nginx.conf.template.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
